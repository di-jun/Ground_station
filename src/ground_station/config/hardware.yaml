transport: ros
profile: hardware
grid:
  rows: 8
  columns: 7
  cell_size_m: 0.5
  altitude_m: 2.0

ros:
  namespace: /uav
  topics:
    state: /uav/state
    position: /uav/local_position/odom
    mission: /uav/mission
    command: /uav/ground_station_command
  queue_size: 10
  heartbeat_timeout_s: 2.0

pw_link:
  enabled: false
  device: /dev/ttyUSB0
  baudrate: 57600
  mode: transparent_serial
  heartbeat_timeout_ms: 1500